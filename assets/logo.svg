<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <linearGradient id="dzGradPrimaryH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="dzGradSecondaryH" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="dzGradCoreH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="crimsonGlowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group 1: Logo Mark (X: 0 to 60) -->
  <g transform="translate(4, 4) scale(0.56)">
    <!-- Dark Shield Base Ring -->
    <circle cx="50" cy="50" r="44" fill="#080b12" stroke="rgba(239, 68, 68, 0.3)" stroke-width="2.5"/>

    <!-- Outer Cyber Orbit Accents -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1.2" stroke-dasharray="24 16 10 16"/>

    <!-- Enso Ring Fragment -->
    <path d="M 50 14 A 36 36 0 1 1 18 64" fill="none" stroke="url(#dzGradPrimaryH)" stroke-width="4.5" stroke-linecap="round" filter="url(#crimsonGlowH)"/>

    <!-- 'D' Loop -->
    <path d="M 32 30 L 46 30 C 58 30 63 38 63 46 C 63 53 58 59 48 60 L 32 60 Z" 
          fill="none" stroke="url(#dzGradSecondaryH)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 'Z' Diagonal -->
    <path d="M 38 40 L 68 40 L 40 68 L 70 68" 
          fill="none" stroke="url(#dzGradPrimaryH)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#crimsonGlowH)"/>

    <!-- Focal Quantum Core -->
    <circle cx="50" cy="50" r="5" fill="url(#dzGradCoreH)" filter="url(#crimsonGlowH)"/>
    <circle cx="50" cy="50" r="2.2" fill="#ffffff"/>

    <!-- Reticles -->
    <line x1="50" y1="8" x2="50" y2="13" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="87" x2="50" y2="92" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="50" x2="13" y2="50" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="87" y1="50" x2="92" y2="50" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Group 2: Typography & Badge -->
  <!-- "Devoted" in pure white Manrope/Inter aesthetic -->
  <text x="74" y="36" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Devoted<tspan fill="url(#dzGradPrimaryH)">Zen</tspan></text>
  
  <!-- "LABS" Pill Badge -->
  <g transform="translate(74, 43)">
    <rect x="0" y="0" width="46" height="15" rx="3.5" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.45)" stroke-width="0.8"/>
    <text x="23" y="11" font-family="'Space Grotesk', 'Inter', monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="1.8" text-anchor="middle">LABS</text>
  </g>

  <!-- Tagline Micro-caption -->
  <text x="130" y="54" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">FRONTIER AI PERCEPTION</text>
</svg>
